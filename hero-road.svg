<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b11"/><stop offset=".55" stop-color="#0b111a"/><stop offset="1" stop-color="#08110d"/></linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2029"/><stop offset="1" stop-color="#07090d"/></linearGradient>
  <linearGradient id="car" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#202b36"/><stop offset=".55" stop-color="#0a0f15"/><stop offset="1" stop-color="#111820"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
  <clipPath id="roadClip"><polygon points="430,205 770,205 1125,380 75,380"/></clipPath>
  <style>
    .sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    @keyframes dash{from{transform:translateY(-100px);opacity:.2}to{transform:translateY(185px);opacity:1}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes scan{0%{transform:translateX(-220px);opacity:0}15%,85%{opacity:.12}100%{transform:translateX(1200px);opacity:0}}
    .d1{animation:dash 1.8s linear infinite}.d2{animation:dash 1.8s linear infinite -.6s}.d3{animation:dash 1.8s linear infinite -1.2s}
    .car{animation:float 2.1s ease-in-out infinite}.pulse{animation:pulse 2.2s ease-in-out infinite}.scan{animation:scan 5s linear infinite}
  </style>
</defs>

<rect width="1200" height="380" fill="url(#bg)"/>
<g opacity=".10" stroke="#34d399"><path d="M0 70H1200M0 120H1200M0 170H1200M0 220H1200M0 270H1200M0 320H1200"/><path d="M80 0V380M160 0V380M240 0V380M320 0V380M400 0V380M480 0V380M560 0V380M640 0V380M720 0V380M800 0V380M880 0V380M960 0V380M1040 0V380M1120 0V380"/></g>
<rect class="scan" x="-180" y="0" width="180" height="380" fill="#22c55e"/>

