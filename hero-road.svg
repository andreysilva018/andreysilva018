  <g transform="translate(194 218)"><rect width="148" height="32" rx="16" fill="#0f1f18" stroke="#22c55e" stroke-opacity=".5"/><text x="74" y="21" text-anchor="middle" fill="#86efac">SPRING BOOT</text></g>
  <g transform="translate(354 218)"><rect width="90" height="32" rx="16" fill="#0f1f18" stroke="#22c55e" stroke-opacity=".5"/><text x="45" y="21" text-anchor="middle" fill="#86efac">SQL</text></g>
  <g transform="translate(456 218)"><rect width="112" height="32" rx="16" fill="#0f1f18" stroke="#22c55e" stroke-opacity=".5"/><text x="56" y="21" text-anchor="middle" fill="#86efac">APIs REST</text></g>
</g>

<polygon points="455,202 745,202 1140,380 60,380" fill="url(#road)"/>
<line x1="455" y1="202" x2="60" y2="380" stroke="#22c55e" stroke-opacity=".35" stroke-width="2"/>
<line x1="745" y1="202" x2="1140" y2="380" stroke="#22c55e" stroke-opacity=".35" stroke-width="2"/>
<g clip-path="url(#roadClip)" fill="#d1fae5"><rect class="d1" x="593" y="220" width="14" height="44" rx="5"/><rect class="d2" x="590" y="260" width="20" height="62" rx="6"/><rect class="d3" x="586" y="315" width="28" height="82" rx="7"/></g>

