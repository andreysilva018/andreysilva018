  <text x="70" y="157" font-size="18" font-weight="700" fill="#a7f3d0">JAVA BACKEND DEVELOPER JR.</text>
  <text x="70" y="188" font-size="13" fill="#94a3b8" class="mono">BUILD → TEST → DEPLOY → IMPROVE</text>
</g>

<g class="mono" font-size="13">
